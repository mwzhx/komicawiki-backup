<!DOCTYPE html>
<html lang="zh-TW" prefix="og: http://ogp.me/ns#">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">

    <meta name="keywords" property="og:article:tag" content="komica-wiki, reko-wiki, web-archive, wayback machine, 備份">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://rekowiki.org/w/images/logo1.ico">
    <!-- <link rel="apple-touch-icon" type="image/png" href="ext/icon.png"> -->
    <title>Komica Wiki GitHub 備份瀏覽器</title>
  </head>
  <body>
    <h1>Komica Wiki GitHub 備份瀏覽器</h1>
    <fieldset>索引資料
      <label>url: <input name="index-path" value="https://mwzhx.github.io/komicawiki-backup/index.ls"> </label>
      <label>file: <input name="index-file" type="file"></label>
      <button name="index-update">更新</button>
    </fieldset>
    <fieldset>
    <label>搜尋 <input name="q">
      <button class="search">搜尋</button> <button class="reset">清除</button></label>
    <label title='格式 "神奇寶貝.*列表" 或是 "/jojo/i"'>
      <input type="checkbox" name="regexp-match">RegExp 匹配</label>
    </fieldset>

    <output name="search-result"></output>

    <footer>
      <p>HTML 預覽功能由 <a href="https://htmlpreview.github.io/">htmlpreview</a> 驅動，原作者為 Jerzy Głowacki，在 Apache License 2.0. 下提供</p>
    </fotter>

    <style>
      output > ol > li > button, output > ol > li > a {
          margin-left: 1ex;
      }
      output {
          display: block;
          min-height: 5em;
          border: solid 1px;
          margin: 1em 0;
      }
      .match-nothing {
          margin: 1em;
          color: red;
      }
      label { display: block; }
      fieldset { margin: 1em 0; }
      footer {
          display: block;
          margin: 1em;
          color: gray;
          font-size: smaller;
      }
    </style>

    <script>
"use strict";

let $d = document;

let $w = window;

function $all(q, root = $d) {
    return Array.from(root.querySelectorAll(q));
}

function $(q, root = $d) {
    return root.querySelector(q);
}

function run(f) {
    return f();
}

let $id = new Proxy({}, {
    get(o, id) {
        let e = $(`#${id}`);
        if (!e) e = $(`[name=${id}]`);
        return e;
    }
});

    function $create(tag, parent, attr) {
        const elm = $d.createElement(tag);
        if (parent) parent.appendChild(elm);
        if (attr) Object.assign(elm, attr);
        return elm;
    }

function $text(q, regexp, root = $d) {
    return $all(q, root).filter(e => regexp.test(e.textContent));
}

function chomp(a) {
    if (!a[0]) a.shift();
}

async function waitUntil(f, interval, timeout) {
    let res;
    const start = Date.now();
    do {
        await sleep(interval);
        if ((Date.now() - start) / 1e3 > timeout) {
            throw new Error("waitUntil timeout");
        }
        res = f();
    } while (!res);
    return res;
}

      class KBrowser {
          async load() {
              let t
              b: {
                  let e = $id['index-file']
                  if (e.files.length != 1) break b
                  let blob = new Blob([e.files[0]])
                  t = await blob.text()
                  e.value = ''
              }
              if (!t) {
                  this.path = $id['index-path'].value
                  const r = await fetch(this.path)
                  t = await r.text()
              }
              t = t.trim().replace(/\r/g, '')
              this.fileList = t.split('\n')
          }
          register() {
              this.titleDefault = document.title
              if (!this.fileList) this.load()
              $id['q'].addEventListener('keydown', evt => {
                  if (evt.key == 'Enter') this.search(evt.target.value)
              })
              $id['index-update'].onclick = () => this.load()
              $('[name=q] ~ button.search').addEventListener('click', evt => {
                  this.search($id['q'].value)
              })
              $('[name=q] ~ button.reset').addEventListener('click', evt => {
                  $id['q'].value = ''
                  $id['q'].focus()
              })
              $('output').addEventListener('click', async evt => {
                  const e = evt.target
                  if (!e.matches('button.html-clean-copy')) return
                  const u = $('a.raw', e.parentNode).href
                  const m = await domCleanFromUrl(u)
                  await navigator.clipboard.writeText(m.innerHTML)
              })
              window.addEventListener('popstate', evt => {
                  const o = evt.state || {resultHtml: '', q: '', count: null}
                  $id['search-result'].innerHTML = o.resultHtml
                  $id.q.value = o.q
                  this.searchTitleSet(o.q, o.count)
              })
          }
          githubBaseUrl = 'https://github.com/mwzhx/komicawiki-backup/blob/master'
          // githubRawBaseUrl = 'https://github.com/mwzhx/komicawiki-backup/raw/refs/heads/master'
          githubRawBaseUrl = 'https://raw.githubusercontent.com/mwzhx/komicawiki-backup/refs/heads/master'
          regexpFormat = /^\/(.+)\/(\w*)$/
          titleDefault = null
          searchTitleSet(q, count) {
              const d = document
              if (!q) d.title = this.titleDefault
              else {
                  d.title = `搜尋:${q}(${count}) - ${this.titleDefault}`
              }
          }
          search(q) {
              let r
              if (this.searchWithRegExp) {
                  let re
                  let m = q.match(this.regexpFormat)
                  if (m) {
                      re = new RegExp(m[1], m[2])
                  }
                  else re = new RegExp(q)
                  r = this.fileList.filter(t => re.test(t))
              }
              else r = this.fileList.filter(t => t.includes(q))

              const e = $id['search-result']
              this.searchClear()
              const ol = $create('ol', e)
              r.map(t => {
                  const li = $create('li')
                  li.textContent = t + ' '
                  li.dataset.path = t
                  let te = t.replace(/%/g, '%25')
                  if (/\.html?$/i.test(t)) $create('a', li, {
                      className: 'preview',
                      target: 'blank',
                      href: `html-preview/?${this.githubBaseUrl}/${te}`,
                      textContent: 'preview'
                  })
                  $create('a', li, {
                      className: 'github',
                      target: 'blank',
                      href: this.githubBaseUrl + '/' + te,
                      textContent: 'github'
                  })
                  $create('a', li, {
                      className: 'raw',
                      target: 'blank',
                      title: '右鍵另存新檔以下載原始檔案',
                      href: this.githubRawBaseUrl + '/' + te,
                      textContent: 'raw'
                  })
                  $create('button', li, {
                      title: '複製清理過的 html，可用於 pandoc html-to-mediawiki',
                      textContent: 'clean html',
                      className: 'html-clean-copy'
                  })
                  return li
              }).forEach(li => ol.appendChild(li))
              if (r.length == 0) {
                  this.searchMatchNothing()
              }
              let qs = '?q=' + encodeURIComponent(q)
              if (this.searchWithRegExp) qs += '&regexp-match=on'
              const state = {resultHtml: e.innerHTML, q, count: r.length}
              history.pushState(state, null, qs)
              this.searchTitleSet(q, r.length)
          }
          searchMatchNothing() {
              const e = $id['search-result']
              e.innerHTML = '<div class="match-nothing">match nothing</div>'
          }
          searchClear() {
              const e = $id['search-result']
              e.classList.remove('match-nothing')
              e.textContent = ''
          }
          get searchWithRegExp() {
              return $id['regexp-match'].checked
          }
          loadQueryString(us = location.href) {
              const u = new URL(us)
              const q = u.searchParams
              if (q.has('regexp-match')) $id['regexp-match'].checked = true
              if (q.has('q')) {
                  $id.q.value = q.get('q')
                  this.search(q.get('q'))
              }
          }
      }

      var kBrowser = new KBrowser()
      kBrowser.load().catch(e => console.error(e)).then(() => {
          kBrowser.register()
          kBrowser.loadQueryString()
      })

      async function domCleanFromUrl(u) {
          const r = await fetch(u)
          const h = await r.text()
          const dp = new DOMParser()
          const d = dp.parseFromString(h, 'text/html')
          const m = domClean(d)
          return m
      }
      function domClean(d) {
          const m = $('#mw-content-text .mw-parser-output',d) ||
                $('.mw-parser-output',d)
          $all('div[id^=mf-section-]',m).forEach(d => {
              if (!d.id.match(/^mf-section-\d+$/)) return
              const f = document.createDocumentFragment()
              f.append(...d.childNodes)
              d.replaceWith(f)
          })

          b: {
              // const colorNode = $create('p', null, {style: 'background:#DDEEFF'})
              // const color = String(colorNode.style.background)
              let h0 = $all('.mw-parser-output div[style]',m).filter(e =>
                  // e.style.background == color
                  String(e.getAttribute('style')).match(/background:\s*#DDEEFF/)
              )
              if (h0.length != 1) break b
              h0 = h0[0]
              const f = document.createDocumentFragment()
              f.append('{{h0|', ...h0.childNodes, '}}')
              h0.replaceWith(f)
          }

          $all('a', m).forEach(a => {
              let r = a.getAttribute('href')
              try {r = decodeURIComponent(r)}
              catch (err) {}
              if (r.startsWith('/')) r = r.slice(1)
              if (r.startsWith('wiki/')) r = r.slice(5)
              a.setAttribute('href', r)
              if (r == a.textContent) {
                  a.replaceWith(new Text(`[[${r}]]`))
              }
          })
          $all('.inline-text-censored',m).forEach(e => {
              const t = document.createDocumentFragment()
              t.append('{{s|', ...e.childNodes, '}}')
              e.replaceWith(t)
          })
          $all('.reference > a', m).forEach(a => {
              const e = a.parentNode
              const id = a.getAttribute('href')
              const note = $(`${id} > .reference-text`, m)
              const t = document.createDocumentFragment()
              t.append('{{ref|', ...note.childNodes, '}}')
              e.replaceWith(t)
          })
          b: {
              const refl = $('.mw-references-wrap',m)
              if (!refl) break b
              refl.before(new Text('{{reflist}}\n\n'))
              refl.remove()
          }
          $all('#toc, .pre-content.heading-holder',m).forEach(e => e.remove())
          $all('h1,h2,h3,h4,h5,h6,h7',m).forEach(h => {
              const e = $('.mw-headline', h)
              if (!e) return
              h.replaceWith($create(h.nodeName, null, {innerHTML: e.innerHTML}))
          })
          return m
      }
    </script>
  </body>
</html>
